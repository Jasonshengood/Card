<title>邀請函｜918 畢業合影</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"華康行楷體","華康行楷體 Std","DFXingKai-B5","DFXingKaiStd-W5","LXGW WenKai TC","BiauKai","標楷體","DFKai-SB","Kaiti TC","STKaiti",serif;--bg:#ffe3ab; --ink:#222; --muted:#7a6a50;
  --orange:#fdb241; --orange-d:#f19a1c; --paper:#fff; --line:#e8b968;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:24px 16px;
}
.scene{width:min(100%,816px);perspective:1400px}

.card{position:relative;display:block}
.face{border-radius:12px;overflow:hidden;filter:drop-shadow(0 10px 18px rgba(120,70,0,.25))}

/* 開場動畫 */
.intro{--R:min(12vw,76px);position:fixed;inset:0;z-index:50;background:var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:veil 3.6s cubic-bezier(.7,0,.3,1) forwards;overflow:hidden}
.plane{width:min(48vw,320px);animation:fly 3.6s linear forwards}
.plane img{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 14px rgba(150,80,0,.28));animation:bob 2.2s ease-in-out infinite}
.grad{color:#fff;font:700 clamp(15px,3.4vw,22px) Arial,sans-serif;letter-spacing:.6em;padding-left:.6em;opacity:0;animation:txt 3.6s ease forwards}
@keyframes veil{0%,72%{transform:none;visibility:visible}99%{transform:translateY(-101%);visibility:visible}100%{transform:translateY(-101%);visibility:hidden}}
@keyframes fly{
  0%{transform:translate(0,0) rotate(0) scale(1);opacity:0}
  4%{opacity:1}
  10%{transform:translate(0,0) rotate(0) scale(1)}
  12.31%{transform:translate(calc(var(--R)*0.4940 + 0.000vmax),calc(var(--R)*-0.1306 + -0.000vmax)) rotate(-7.6deg) scale(1.000);opacity:1}
  14.62%{transform:translate(calc(var(--R)*0.8591 + 0.000vmax),calc(var(--R)*-0.4881 + -0.000vmax)) rotate(-37.2deg) scale(1.002);opacity:1}
  16.94%{transform:translate(calc(var(--R)*0.9998 + 0.003vmax),calc(var(--R)*-0.9793 + -0.003vmax)) rotate(-66.7deg) scale(1.004);opacity:1}
  19.25%{transform:translate(calc(var(--R)*0.8795 + 0.009vmax),calc(var(--R)*-1.4759 + -0.009vmax)) rotate(-96.2deg) scale(1.006);opacity:1}
  21.56%{transform:translate(calc(var(--R)*0.5295 + 0.026vmax),calc(var(--R)*-1.8483 + -0.026vmax)) rotate(-125.4deg) scale(1.010);opacity:1}
  23.88%{transform:translate(calc(var(--R)*0.0413 + 0.059vmax),calc(var(--R)*-1.9991 + -0.059vmax)) rotate(-154.8deg) scale(1.014);opacity:1}
  26.19%{transform:translate(calc(var(--R)*-0.4577 + 0.118vmax),calc(var(--R)*-1.8891 + -0.118vmax)) rotate(-184.6deg) scale(1.019);opacity:1}
  28.50%{transform:translate(calc(var(--R)*-0.8372 + 0.215vmax),calc(var(--R)*-1.5469 + -0.215vmax)) rotate(-215.5deg) scale(1.025);opacity:1}
  30.81%{transform:translate(calc(var(--R)*-0.9981 + 0.365vmax),calc(var(--R)*-1.0620 + -0.365vmax)) rotate(-247.8deg) scale(1.032);opacity:1}
  33.12%{transform:translate(calc(var(--R)*-0.8984 + 0.586vmax),calc(var(--R)*-0.5608 + -0.586vmax)) rotate(-280.8deg) scale(1.039);opacity:1}
  35.44%{transform:translate(calc(var(--R)*-0.5641 + 0.901vmax),calc(var(--R)*-0.1743 + -0.901vmax)) rotate(-312.8deg) scale(1.047);opacity:1}
  37.75%{transform:translate(calc(var(--R)*-0.0826 + 1.332vmax),calc(var(--R)*-0.0034 + -1.332vmax)) rotate(-341.9deg) scale(1.056);opacity:1}
  40.06%{transform:translate(calc(var(--R)*-0.0000 + 1.910vmax),calc(var(--R)*-0.0000 + -1.910vmax)) rotate(-383.0deg) scale(1.066);opacity:1}
  42.38%{transform:translate(calc(var(--R)*-0.0000 + 2.666vmax),calc(var(--R)*-0.0000 + -2.666vmax)) rotate(-383.0deg) scale(1.077);opacity:1}
  44.69%{transform:translate(calc(var(--R)*-0.0000 + 3.636vmax),calc(var(--R)*-0.0000 + -3.636vmax)) rotate(-383.0deg) scale(1.088);opacity:1}
  47.00%{transform:translate(calc(var(--R)*-0.0000 + 4.861vmax),calc(var(--R)*-0.0000 + -4.861vmax)) rotate(-383.0deg) scale(1.100);opacity:1}
  49.31%{transform:translate(calc(var(--R)*-0.0000 + 6.386vmax),calc(var(--R)*-0.0000 + -6.386vmax)) rotate(-383.0deg) scale(1.113);opacity:1}
  51.62%{transform:translate(calc(var(--R)*-0.0000 + 8.259vmax),calc(var(--R)*-0.0000 + -8.259vmax)) rotate(-383.0deg) scale(1.127);opacity:1}
  53.94%{transform:translate(calc(var(--R)*-0.0000 + 10.534vmax),calc(var(--R)*-0.0000 + -10.534vmax)) rotate(-383.0deg) scale(1.141);opacity:1}
  56.25%{transform:translate(calc(var(--R)*-0.0000 + 13.269vmax),calc(var(--R)*-0.0000 + -13.269vmax)) rotate(-383.0deg) scale(1.156);opacity:1}
  58.56%{transform:translate(calc(var(--R)*-0.0000 + 16.527vmax),calc(var(--R)*-0.0000 + -16.527vmax)) rotate(-383.0deg) scale(1.172);opacity:1}
  60.88%{transform:translate(calc(var(--R)*-0.0000 + 20.376vmax),calc(var(--R)*-0.0000 + -20.376vmax)) rotate(-383.0deg) scale(1.189);opacity:1}

  70.12%{transform:translate(calc(var(--R)*-0.0000 + 43.211vmax),calc(var(--R)*-0.0000 + -43.211vmax)) rotate(-383.0deg) scale(1.264);opacity:1}
  72.44%{transform:translate(calc(var(--R)*-0.0000 + 51.210vmax),calc(var(--R)*-0.0000 + -51.210vmax)) rotate(-383.0deg) scale(1.285);opacity:1}
  74.75%{transform:translate(calc(var(--R)*-0.0000 + 60.315vmax),calc(var(--R)*-0.0000 + -60.315vmax)) rotate(-383.0deg) scale(1.306);opacity:1}
  77.06%{transform:translate(calc(var(--R)*-0.0000 + 70.633vmax),calc(var(--R)*-0.0000 + -70.633vmax)) rotate(-383.0deg) scale(1.329);opacity:1}
  79.38%{transform:translate(calc(var(--R)*-0.0000 + 82.274vmax),calc(var(--R)*-0.0000 + -82.274vmax)) rotate(-383.0deg) scale(1.352);opacity:1}
  81.69%{transform:translate(calc(var(--R)*-0.0000 + 95.355vmax),calc(var(--R)*-0.0000 + -95.355vmax)) rotate(-383.0deg) scale(1.375);opacity:1}
  84.00%{transform:translate(calc(var(--R)*-0.0000 + 110.000vmax),calc(var(--R)*-0.0000 + -110.000vmax)) rotate(-383.0deg) scale(1.400);opacity:1}
  100%{transform:translate(calc(var(--R)*-0.0000 + 110.000vmax),calc(var(--R)*-0.0000 + -110.000vmax)) rotate(-383.0deg) scale(1.400);opacity:0}
}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes txt{0%,4%{opacity:0;transform:translateY(8px)}12%,24%{opacity:1;transform:none}40%,100%{opacity:0}}
.scene{animation:rise 1s cubic-bezier(.2,.8,.2,1) 2.7s both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro{display:none}.scene{animation:none}}

/* ticket */
.ticket{
  background:var(--paper);color:#222;position:relative;
  display:grid;grid-template-columns:58px 1fr 236px;grid-template-rows:38px 1fr 16px;
  min-height:264px;
}
.hd{font-family:var(--font);background:var(--orange);color:#fff;display:flex;align-items:center;padding:0 16px;font-size:18px;letter-spacing:.12em}
.hd.l{grid-column:1/3;gap:10px}
.hd.r{grid-column:3;justify-content:center;letter-spacing:.06em;font-size:18px;border-left:2px dashed #fff8}
.ft{grid-column:1/-1;background:var(--orange)}
.num{font-family:var(--font);grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:32px;line-height:1.35;border-right:2px dashed var(--line)}
.main{grid-row:2;grid-column:2;position:relative;padding:22px 28px 70px 22px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.to{font-size:21px;margin:0}
.msg{font-size:20px;line-height:1.75;margin:0 0 0 20px;max-width:19.5em;letter-spacing:.04em}
.cap{position:absolute;top:4px;right:28px;width:110px}
.stub{grid-row:2;grid-column:3;border-left:2px dashed var(--line);padding:16px 22px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.hbar svg{width:100%;height:46px;display:block}
.info{font-size:14px;line-height:1.7;margin:0}
.info dt{font-weight:700;margin-top:4px}
.info dd{margin:0}
/* ticket notches */
.notch{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--bg);left:calc(100% - 236px - 10px);z-index:2}
.notch.t{top:28px}.notch.b{bottom:6px}
.scroll{width:42px;height:auto}
.ch{position:absolute;z-index:1;height:auto;pointer-events:none}
.kitty{width:74px;left:6px;bottom:14px}
.kuromi{width:86px;right:calc(236px + 28px);bottom:14px}
.pocha{width:46px;right:14px;bottom:14px}

@media (max-width:720px){
  .ticket{grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto}
  .hd.l,.hd.r{grid-column:1;border:0;justify-content:flex-start}
  .hd.r{display:none}
  .num{grid-row:auto;flex-direction:row;gap:14px;border:0;border-bottom:2px dashed var(--line);padding:10px;font-size:26px}
  .main{grid-row:auto;grid-column:1;padding:20px 18px 20px}
  .msg{margin-left:0;font-size:18px}
  .cap{top:10px;right:14px;width:84px}
  .kitty{left:10px;bottom:20px}
  .kuromi{right:auto;left:calc(50% - 43px);bottom:20px}
  .pocha{right:14px;bottom:20px}
      .stub{grid-row:auto;grid-column:1;border-left:0;border-top:2px dashed var(--line);padding:16px 20px 84px}
  .hbar svg{height:40px}
  .notch{display:none}
  body{padding:32px 22px}
  .hd.l{padding:14px 22px;font-size:19px;gap:12px}
  .scroll{width:46px}
  .num{padding:14px}
  .main{padding:26px 26px 30px}
  .stub{padding:22px 26px 96px}
  .cap{top:14px;right:22px}
  .kitty{left:20px;bottom:26px}
  .kuromi{bottom:26px}
  .pocha{right:22px;bottom:26px}
}
</style>

<script>
(function(){

  // 條碼：依固定種子產生，每次載入都相同
  function bars(svg,count,vertical){
    var s=918,x=0,w=100,out='',vals=[];
    for(var i=0;i<count;i++){s=(s*9301+49297)%233280;vals.push(1+Math.floor(s/233280*3));}
    var total=0;vals.forEach(function(v){total+=v});
    var u=100/total,pos=0;
    vals.forEach(function(v,i){
      var len=v*u;
      if(i%2===0){
        out+=vertical
          ?'<rect x="0" y="'+pos+'" width="100" height="'+len+'" fill="#111"/>'
          :'<rect x="'+pos+'" y="0" width="'+len+'" height="100" fill="#111"/>';
      }
      pos+=len*1.0;
    });
    svg.setAttribute('viewBox','0 0 100 100');
    svg.innerHTML=out;
  }
  bars(document.getElementById('hbar'),64,false);
})();
</script>
